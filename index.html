<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historie Zápasů</title>
    <link rel="icon" href="https://i.imgur.com/W8ufoBX.png" type="image/png">
    <style>
        body { 
            font-family: Arial, sans-serif; 
            margin: 0; 
            padding: 0; 
            background: #111; 
            color: #fff; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
        }
        #history_container { 
            width: 100%; 
            max-width: 800px; 
            background: #222; 
            border-radius: 10px; 
            padding: 2rem; 
            box-shadow: 0px 0px 20px rgba(0,0,0,0.5); 
            text-align: center;
        }
        textarea { 
            width: calc(100% - 20px); 
            height: 300px; 
            margin-bottom: 10px; 
            padding: 10px; 
            border-radius: 6px; 
            border: 1px solid #444; 
            background: #333; 
            color: #fff; 
            resize: none; 
        }
        button { 
            margin: 5px; 
            padding: 10px 20px; 
            font-size: 14px; 
            cursor: pointer; 
            background: #444; 
            border: none; 
            border-radius: 6px; 
            color: #fff; 
        }
        button:hover { 
            background: #555; 
        }
        #output { 
            border: none; 
            padding: 10px; 
            background: transparent; 
            color: #fff; 
            white-space: pre-wrap; 
            margin-top: 1rem; 
            text-align: left;
        }
        .button-container { 
            display: flex; 
            justify-content: center; 
            gap: 10px; 
            flex-wrap: wrap; 
        }
    </style>
</head>
<body>
    <div id="history_container">
        <h1>Historie Zápasů</h1>
        <textarea id="input" placeholder="Vložte historii zápasů sem..."></textarea>
        <div class="button-container">
            <button onclick="processMatches()">Zobrazit Historii</button>
            <button onclick="copyToClipboard()">Kopírovat</button>
            <button onclick="clearOutput()">Odstranit</button>
        </div>
        <div id="output"></div>
    </div>

    <script>
        let lastOutput = '';

        function processMatches() {
            const raw = document.getElementById('input').value.trim();
            const lines = raw.split('\n').map(l => l.trim()).filter(l => l !== '');

            let output = '';
            let matchCount = 0;

            const teamName = lines[0] || 'Neznámý tým';

            // Helper: najde první W/L/D v okolí
            function findResult(arr, idx) {
                const valid = ['W', 'L', 'D'];
                for (let o = 0; o < 6; o++) {
                    if (valid.includes(arr[idx + o])) return arr[idx + o];
                }
                return null;
            }

            // Helper: najde první dvě čísla jako skóre
            function findScores(arr, idx) {
                let nums = [];
                for (let o = 0; o < 8; o++) {
                    if (!arr[idx + o]) continue;
                    if (!isNaN(arr[idx + o])) nums.push(arr[idx + o]);
                    if (nums.length === 2) break;
                }
                return nums.length === 2 ? nums : null;
            }

            for (let i = 1; i < lines.length; ) {

                // 1) Datum (může obsahovat čas)
                const date = lines[i];
                if (!date.match(/^\d{2}\.\d{2}\.\d{2}/)) {
                    i++;
                    continue;
                }

                // 2) Turnaj
                const tournament = lines[i + 1] || '';

                // 3) Tým 1
                const team1 = lines[i + 2] || '';

                // 4) Tým 2
                const team2 = lines[i + 3] || '';

                // 5–6) Skóre (najdeme první dvě čísla)
                const scores = findScores(lines, i + 4);
                if (!scores) {
                    i += 5;
                    continue;
                }
                const s1 = parseInt(scores[0]);
                const s2 = parseInt(scores[1]);

                // 7) Výsledek (W/L/D)
                const result = findResult(lines, i + 4);

                // Určení, zda analyzovaný tým je vlevo nebo vpravo
                const analyzed = teamName.replace("Last matches: ", "").trim().toLowerCase();
                const left = team1.toLowerCase();
                const right = team2.toLowerCase();

                let matchResult = 'Remíza';

                if (result === 'W') {
                    if (left === analyzed) matchResult = 'Výhra';
                    else if (right === analyzed) matchResult = 'Výhra';
                    else matchResult = 'Výhra';
                }

                if (result === 'L') {
                    if (left === analyzed) matchResult = 'Prohra';
                    else if (right === analyzed) matchResult = 'Prohra';
                    else matchResult = 'Prohra';
                }

                if (result === 'D') {
                    matchResult = 'Remíza';
                }

                output += `${team1} vs ${team2}: ${s1}-${s2} - ${matchResult} (${date})\n`;
                matchCount++;

                // Posuneme index — najdeme první řádek po výsledku
                let jump = 4;
                while (lines[i + jump] && !['W','L','D'].includes(lines[i + jump])) jump++;
                jump++; // přeskočíme i výsledek
                i += jump;
            }

            lastOutput = `Analyzovaný tým/hráč: ${teamName}\nCelkový počet zápasů: ${matchCount}\n\n${output.trim()}`;
            document.getElementById('output').textContent = lastOutput;
        }

        function copyToClipboard() {
            if (!lastOutput) return alert('Nejprve zobrazte historii.');
            const t = document.createElement('textarea');
            t.value = lastOutput;
            document.body.appendChild(t);
            t.select();
            document.execCommand('copy');
            document.body.removeChild(t);
            alert('Zkopírováno!');
        }

        function clearOutput() {
            document.getElementById('input').value = '';
            document.getElementById('output').textContent = '';
            lastOutput = '';
        }
    </script>
</body>
</html>
