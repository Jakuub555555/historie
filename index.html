<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historie Zápasů</title>
    <link rel="icon" href="https://i.imgur.com/W8ufoBX.png" type="image/png">
    <style>
        body { 
            font-family: Arial, sans-serif; 
            margin: 0; 
            padding: 0; 
            background: #111; 
            color: #fff; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
        }
        #history_container { 
            width: 100%; 
            max-width: 800px; 
            background: #222; 
            border-radius: 10px; 
            padding: 2rem; 
            box-shadow: 0px 0px 20px rgba(0,0,0,0.5); 
            text-align: center;
        }
        textarea { 
            width: calc(100% - 20px); 
            height: 300px; 
            margin-bottom: 10px; 
            padding: 10px; 
            border-radius: 6px; 
            border: 1px solid #444; 
            background: #333; 
            color: #fff; 
            resize: none; 
        }
        button { 
            margin: 5px; 
            padding: 10px 20px; 
            font-size: 14px; 
            cursor: pointer; 
            background: #444; 
            border: none; 
            border-radius: 6px; 
            color: #fff; 
        }
        button:hover { 
            background: #555; 
        }
        #output { 
            border: none; 
            padding: 10px; 
            background: transparent; 
            color: #fff; 
            white-space: pre-wrap; 
            margin-top: 1rem; 
            text-align: left;
        }
        .button-container { 
            display: flex; 
            justify-content: center; 
            gap: 10px; 
            flex-wrap: wrap; 
        }
    </style>
</head>
<body>
    <div id="history_container">
        <h1>Historie Zápasů</h1>
        <textarea id="input" placeholder="Vložte historii zápasů sem..."></textarea>
        <div class="button-container">
            <button onclick="processMatches()">Zobrazit Historii</button>
            <button onclick="copyToClipboard()">Kopírovat</button>
            <button onclick="clearOutput()">Odstranit</button>
        </div>
        <div id="output"></div>
    </div>

    <script>
        let lastOutput = '';

        function processMatches() {
            const raw = document.getElementById('input').value.trim();
            const lines = raw.split('\n').map(l => l.trim()).filter(l => l !== '');

            let output = '';
            let matchCount = 0;

            const teamName = lines[0] || 'Neznámý tým';

            let i = 1;

            while (i < lines.length) {
                // 1) Najdi datum
                if (!lines[i] || !lines[i].match(/^\d{2}\.\d{2}\.\d{2}/)) {
                    i++;
                    continue;
                }

                const date = lines[i];       // např. 25.05.26
                // lines[i+1] = turnaj (DIV apod.)

                // Struktura bloku (každý název týmu je zdvojen):
                // i+0  datum
                // i+1  turnaj
                // i+2  team1  (první výskyt)
                // i+3  team1  (duplikát – přeskočíme)
                // i+4  team2  (první výskyt)
                // i+5  team2  (duplikát – přeskočíme)
                // i+6  skóre1
                // i+7  skóre2
                // i+8  W/L/D

                const team1 = lines[i + 2] || '';
                const team2 = lines[i + 4] || '';

                const score1Raw = lines[i + 6];
                const score2Raw = lines[i + 7];

                if (!score1Raw || !score2Raw || isNaN(score1Raw) || isNaN(score2Raw)) {
                    i += 9;
                    continue;
                }

                const s1 = parseInt(score1Raw);
                const s2 = parseInt(score2Raw);

                const resultRaw = (lines[i + 8] || '').toUpperCase();
                if (!['W', 'L', 'D'].includes(resultRaw)) {
                    i += 9;
                    continue;
                }

                let matchResult;
                if (resultRaw === 'D') matchResult = 'Remíza';
                else if (resultRaw === 'W') matchResult = 'Výhra';
                else matchResult = 'Prohra';

                output += `${team1} vs ${team2}: ${s1}-${s2} - ${matchResult} (${date})\n`;
                matchCount++;

                i += 9; // každý blok má přesně 9 řádků
            }

            lastOutput = `Analyzovaný tým/hráč: ${teamName}\nCelkový počet zápasů: ${matchCount}\n\n${output.trim()}`;
            document.getElementById('output').textContent = lastOutput;
        }

        function copyToClipboard() {
            if (!lastOutput) return alert('Nejprve zobrazte historii.');
            const t = document.createElement('textarea');
            t.value = lastOutput;
            document.body.appendChild(t);
            t.select();
            document.execCommand('copy');
            document.body.removeChild(t);
            alert('Zkopírováno!');
        }

        function clearOutput() {
            document.getElementById('input').value = '';
            document.getElementById('output').textContent = '';
            lastOutput = '';
        }
    </script>
</body>
</html>
